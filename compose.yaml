x-app: &app
  build: .
  environment: &env
    DB_HOST: db
    POSTGRES_DB: assessment
    POSTGRES_USER: assessment
    POSTGRES_PASSWORD: local-development-only
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: local-development-only
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7.4.1-alpine
    command: redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  init:
    <<: *app
    command: python manage.py migrate --noinput
  web:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
  worker:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    command: celery -A config worker -l INFO --concurrency=4
  beat:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    command: celery -A config beat -l INFO
volumes:
  postgres:
  redis:
